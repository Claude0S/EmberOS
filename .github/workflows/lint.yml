name: Lint configs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: pacman -Syu --noconfirm --needed hyprland quickshell qt6-declarative python python-yaml python-jsonschema shellcheck git >/dev/null

      - name: Calamares configs vs official schemas
        run: |
          cd /tmp && git clone -q https://aur.archlinux.org/calamares.git aur-cal
          . aur-cal/PKGBUILD
          curl -fsSL -o cal.tar.gz "${source[0]#*::}"
          mkdir cal && tar -xzf cal.tar.gz -C cal --strip-components=1
          cd "$GITHUB_WORKSPACE"
          python tests/calamares-schema.py /tmp/cal profile/airootfs/etc/calamares

      - name: Shell scripts (bash -n + shellcheck)
        run: |
          set -e
          SH=$(for f in build.sh tests/*.sh profile/airootfs/usr/local/bin/*; do head -1 "$f" | grep -q python || echo "$f"; done)
          PY=$(for f in profile/airootfs/usr/local/bin/*; do head -1 "$f" | grep -q python && echo "$f"; done)
          for f in $SH; do bash -n "$f" && echo "syntax ok: $f"; done
          for f in $PY; do python -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f" && echo "python ok: $f"; done
          shellcheck -S warning $SH || true

      - name: JSON configs
        run: |
          python - <<'EOF'
          import json, re, glob, sys
          bad = 0
          import os
          files = [os.path.join(d, n) for d, _, fs in os.walk('profile') for n in fs if '.json' in n]
          for f in files:
              s = open(f).read()
              s = re.sub(r'^\s*//.*$', '', s, flags=re.M)
              try: json.loads(s); print('json ok:', f)
              except Exception as e: print('JSON ERROR:', f, e); bad = 1
          sys.exit(bad)
          EOF

      - name: Hyprland config (--verify-config)
        run: |
          useradd -m linter
          cp -r profile/airootfs/etc/skel/. /home/linter/
          cp profile/airootfs/usr/share/ember/little/mode.lua /tmp/little.lua
          chown -R linter: /home/linter
          cat > /tmp/verify.sh <<'EOS'
          export XDG_RUNTIME_DIR=$(mktemp -d)
          C=$HOME/.config/hypr/hyprland.lua
          echo "=== full mode ==="; Hyprland --verify-config -c "$C" 2>&1
          cp /tmp/little.lua $HOME/.config/hypr/mode.lua
          echo "=== little mode ==="; Hyprland --verify-config -c "$C" 2>&1
          EOS
          out=$(su linter -c 'bash /tmp/verify.sh' || true)
          echo "$out"
          if echo "$out" | grep -vE 'DEBUG|Socket2|IPC will not work' | grep -E 'ERR|rror|nvalid|nknown|deprecated'; then echo "::error::Hyprland config has problems"; exit 1; fi

      - name: QML (qmllint)
        run: |
          L=/usr/lib/qt6/bin/qmllint
          for f in $(find profile -name '*.qml'); do
            echo "== $f"
            $L -I /usr/lib/qt6/qml -I "$(dirname "$f")" "$f" 2>&1 | grep -E 'Error|error' || echo "no errors"
          done
