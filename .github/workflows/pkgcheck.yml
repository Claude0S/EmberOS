name: Check package availability

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package names"
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Official repos (core/extra/multilib)
        env:
          PKGS: ${{ inputs.packages }}
        run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Sy --noconfirm >/dev/null
          for p in $PKGS; do
            if r=$(pacman -Si "$p" 2>/dev/null | awk -F': ' '/^Repository/{print $2; exit}'); [ -n "$r" ]; then
              echo "OFFICIAL  $r/$p"
            elif prov=$(pacman -Ssq "^$p\$" 2>/dev/null); [ -n "$prov" ]; then
              echo "OFFICIAL? $p (search match)"
            else
              echo "MISSING   $p"
            fi
          done | tee /tmp/official.txt

      - name: Chaotic-AUR (for missing ones)
        run: |
          pacman-key --init >/dev/null 2>&1
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --noconfirm \
            'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst' \
            'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'
          printf '\n[chaotic-aur]\nInclude = /etc/pacman.d/chaotic-mirrorlist\n' >> /etc/pacman.conf
          pacman -Sy --noconfirm >/dev/null
          for p in $(awk '$1=="MISSING"{print $2}' /tmp/official.txt); do
            if pacman -Si "$p" >/dev/null 2>&1; then echo "CHAOTIC   $p"; else echo "NOWHERE   $p"; fi
          done
