name: Re-test install (reuse an ISO)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run id whose ISO artifact to reuse"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  retest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iso
          path: out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Install test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils socat imagemagick libarchive-tools dosfstools mtools >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          bash tests/install-test.sh out/*.iso screenshots
      - name: Publish screenshots
        if: always()
        run: |
          [ -d screenshots ] || exit 0
          rm -rf /tmp/shots && mkdir -p /tmp/shots/retest-${{ github.run_number }}
          cp -r screenshots/. /tmp/shots/retest-${{ github.run_number }}/
          cd /tmp/shots && git init -q -b shots && git config user.name ember-bot && git config user.email ember-bot@users.noreply.github.com
          git add -A && git commit -qm "retest ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots
