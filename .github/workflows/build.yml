name: Build Ember OS ISO

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iso-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Week number (Calamares is rebuilt weekly, to match Qt updates)
        id: week
        run: echo "w=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache AUR packages (Calamares)
        uses: actions/cache@v4
        with:
          path: aur-cache
          key: aur-${{ hashFiles('profile/aur.txt') }}-${{ steps.week.outputs.w }}

      - name: Build ISO (Arch Linux container)
        run: |
          docker run --rm --privileged \
            -v "$PWD:/repo" \
            -e SOURCE_DATE_EPOCH="$(date +%s)" \
            archlinux:latest bash /repo/build.sh
          sudo chown -R "$(id -u):$(id -g)" out aur-cache
          ls -lh out

      - name: Boot test in QEMU (screenshots)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 socat imagemagick >/dev/null
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          bash tests/qemu-boot.sh out/*.iso screenshots

      - name: Install test in QEMU (install to a virtual disk, reboot, screenshots)
        run: |
          sudo apt-get install -y -qq libarchive-tools qemu-utils >/dev/null
          bash tests/install-test.sh out/*.iso screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: Publish screenshots to the "shots" branch
        if: always()
        run: |
          [ -d screenshots ] || exit 0
          rm -rf /tmp/shots && mkdir -p /tmp/shots/build-${{ github.run_number }}
          cp -r screenshots/. /tmp/shots/build-${{ github.run_number }}/
          cd /tmp/shots
          git init -q -b shots
          git config user.name "ember-bot"
          git config user.email "ember-bot@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots: build ${{ github.run_number }} (${{ github.sha }})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" shots

      - name: Check ISO size (GitHub limit 2 GiB per file)
        run: |
          size=$(stat -c %s out/*.iso)
          echo "ISO size: $((size / 1024 / 1024)) MiB"
          if [ "$size" -ge 2147483648 ]; then echo "ISO is too big for a GitHub release"; exit 1; fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ember OS — build ${{ github.run_number }}
          make_latest: true
          body: |
            Ember OS, автоматическая сборка №${{ github.run_number }} (коммит ${{ github.sha }}).

            **Скачать:** файл `emberos-*.iso` ниже.
            Запиши на флешку через Ventoy / Rufus (режим DD) / balenaEtcher
            или открой в VirtualBox (тип: Linux → Arch Linux 64-bit, 4 ГБ памяти, графика VMSVGA, EFI можно включить).

            Скриншоты автоматической проверки в QEMU прикреплены ниже.
          files: |
            out/*.iso
            out/*.sha256
            screenshots/*.png
