name: Explore (dev helper)

# Dev helper: push to the "explore" branch to run .github/explore.sh in Arch.
on:
  push:
    branches: ['explore*']

jobs:
  run:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: |
          pacman -Syu --noconfirm --needed $(cat .github/explore.pkgs 2>/dev/null) >/dev/null 2>&1
          bash .github/explore.sh
