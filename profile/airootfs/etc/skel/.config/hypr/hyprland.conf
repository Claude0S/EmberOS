# ───────────────────────────────────────────────
#  Ember OS — Hyprland
#  Свои правки удобнее класть в ~/.config/hypr/user.conf
# ───────────────────────────────────────────────

# Монитор: родное разрешение и частота, автоматически
monitor = , preferred, auto, 1

# Режим (full / little) — переключается командой /little и /full
source = ~/.config/hypr/mode.conf

$terminal = kitty
$files    = thunar
$browser  = firefox
$menu     = fuzzel

# ─── Автозапуск ───
exec-once = hyprpaper
exec-once = waybar
exec-once = swaync
exec-once = nwg-dock-hyprland -d -i 42 -mb 10 -hd 0 -c "fuzzel"
exec-once = quickshell
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = nm-applet --indicator
exec-once = wl-paste --watch cliphist store
exec-once = /usr/local/bin/ember-firstrun

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GTK_THEME,Adwaita:dark

# ─── Внешний вид ───
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(e8875aee) rgba(f2c37aee) 45deg
    col.inactive_border = rgba(52304966)
    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.94

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(0a060cAA)
    }

    blur {
        enabled = true
        size = 7
        passes = 2
        new_optimizations = true
        vibrancy = 0.2
    }
}

animations {
    enabled = true
    bezier = ember,   0.22, 1, 0.36, 1
    bezier = soft,    0.4, 0, 0.2, 1
    bezier = pop,     0.34, 1.56, 0.64, 1

    animation = windows,     1, 5, pop,   popin 80%
    animation = windowsOut,  1, 4, soft,  popin 85%
    animation = border,      1, 8, soft
    animation = borderangle, 1, 40, soft, loop
    animation = fade,        1, 5, ember
    animation = workspaces,  1, 5, ember, slidefade 20%
    animation = layers,      1, 4, ember, fade
    animation = specialWorkspace, 1, 5, ember, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(1a1320)
    focus_on_activate = true
}

input {
    kb_layout = us,ua
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

gestures {
    workspace_swipe = true
}

# ─── Правила окон ───
windowrulev2 = float, class:^(pavucontrol|nm-connection-editor|blueman-manager|org.pulseaudio.pavucontrol)$
windowrulev2 = float, title:^(Picture-in-Picture|Картинка в картинке)$
windowrulev2 = pin,   title:^(Picture-in-Picture|Картинка в картинке)$
# Командная строка Ember (Win+Enter) — на своём «специальном» рабочем столе
windowrulev2 = workspace special:shell silent, class:^(ember-shell)$
windowrulev2 = fullscreen, class:^(ember-shell)$
windowrulev2 = opacity 0.92 0.92, class:^(ember-shell)$
layerrule = blur, waybar
layerrule = blur, launcher
layerrule = blur, swaync-control-center
layerrule = blur, nwg-dock
layerrule = ignorezero, nwg-dock
layerrule = blur, ember-widget
layerrule = ignorezero, ember-widget

# ─── Клавиши ───
$mod = SUPER

bind = $mod, RETURN, exec, /usr/local/bin/ember-toggle-shell
bind = $mod, T, exec, $terminal
bind = $mod, Q, killactive
bind = $mod, E, exec, $files
bind = $mod, B, exec, $browser
bind = $mod, D, exec, $menu
bind = $mod, SPACE, exec, $menu
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, L, exec, hyprlock
bind = $mod, N, exec, swaync-client -t -sw
bind = $mod SHIFT, V, exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = , PRINT, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Ember OS" "Скриншот скопирован"
bind = SHIFT, PRINT, exec, grim ~/Pictures/screenshot-$(date +%F-%H%M%S).png && notify-send "Ember OS" "Скриншот сохранён"
bind = $mod SHIFT, E, exec, /usr/local/bin/ember-power

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Мультимедиа-клавиши ноутбука
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous

# Личные настройки пользователя (не перезаписываются обновлениями)
source = ~/.config/hypr/user.conf
