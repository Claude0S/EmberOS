# Ember OS — экран блокировки

general {
    hide_cursor = true
    grace = 0
}

animations {
    enabled = true
    bezier = ember, 0.22, 1, 0.36, 1
    animation = fadeIn,  1, 5, ember
    animation = fadeOut, 1, 5, ember
    animation = inputFieldDots, 1, 2, ember
}

background {
    monitor =
    path = /usr/share/backgrounds/ember/lake.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.75
    vibrancy = 0.2
}

# Часы
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(fbeee0ff)
    font_size = 110
    font_family = Inter Display Bold
    position = 0, 260
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

# Дата
label {
    monitor =
    text = cmd[update:60000] LC_TIME=${LANG:-en_US.UTF-8} date +"%A, %d %B"
    color = rgba(f3a46cff)
    font_size = 24
    font_family = Inter
    position = 0, 160
    halign = center
    valign = center
}

# Лисёнок
image {
    monitor =
    path = /usr/share/ember/icons/fox-avatar.png
    size = 120
    rounding = 28
    border_size = 3
    border_color = rgba(e8875aee)
    position = 0, 10
    halign = center
    valign = center
}

# Имя пользователя
label {
    monitor =
    text = $USER
    color = rgba(fbeee0dd)
    font_size = 16
    font_family = Inter
    position = 0, -75
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(e8875acc)
    inner_color = rgba(1a1320bb)
    font_color = rgba(fbeee0ff)
    check_color = rgba(f2c37aff)
    fail_color = rgba(d9534fff)
    fade_on_empty = false
    placeholder_text = <span foreground="##fbeee099">Пароль / Password</span>
    fail_text = Неверный пароль
    rounding = 16
    position = 0, -145
    halign = center
    valign = center
}

# Подсказка внизу
label {
    monitor =
    text = Ember OS
    color = rgba(fbeee077)
    font_size = 13
    font_family = Inter
    position = 0, 30
    halign = center
    valign = bottom
}
