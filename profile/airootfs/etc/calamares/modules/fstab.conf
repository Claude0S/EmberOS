---
mountOptions:
  default: defaults,noatime
  btrfs: defaults,noatime,compress=zstd
  efi: defaults,umask=0077
ssdExtraMountOptions:
  ext4: discard=async
  xfs: discard
  btrfs: discard=async,ssd
tmpOptions:
  default:
    tmpfs: false
    options: ""
  ssd:
    tmpfs: true
    options: "defaults,noatime,mode=1777"
