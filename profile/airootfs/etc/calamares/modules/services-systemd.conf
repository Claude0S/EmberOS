---
units:
  - name: NetworkManager
    action: enable
    mandatory: true
  - name: sddm
    action: enable
    mandatory: true
  - name: bluetooth
    action: enable
  - name: fstrim.timer
    action: enable
  - name: ember-drivers
    action: enable
  - name: ember-setup-apps
    action: enable
  - name: ember-live-user
    action: disable
  - name: sshd
    action: disable
  - name: pacman-init
    action: disable
  - name: choose-mirror
    action: disable
