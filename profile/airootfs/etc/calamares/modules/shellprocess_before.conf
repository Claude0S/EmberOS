# Перед созданием пользователя: ядро и сеть внутри новой системы
---
dontChroot: true
timeout: 600
script:
  - "cp /run/archiso/bootmnt/arch/boot/x86_64/vmlinuz-linux ${ROOT}/boot/vmlinuz-linux"
  - "-cp /run/archiso/bootmnt/arch/boot/intel-ucode.img ${ROOT}/boot/"
  - "-cp /run/archiso/bootmnt/arch/boot/amd-ucode.img ${ROOT}/boot/"
  - "-cp -L /etc/resolv.conf ${ROOT}/etc/resolv.conf"
