---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - name: wheel
    must_exist: false
    system: true
  - audio
  - video
  - input
  - network
  - storage
  - lp
  - render
  - autologin

autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: true
doReusePassword: true

passwordRequirements:
  nonempty: true
  minLength: 1
allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
  shell: /bin/bash
  forbidden_names: [ root ]

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "ember-${cpu}"
  forbidden_names: [ localhost ]
