# Ember OS — Calamares
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: before
    module: shellprocess
    config: shellprocess_before.conf
  - id: ember
    module: shellprocess
    config: shellprocess_ember.conf
  - id: drivers
    module: shellprocess
    config: shellprocess_drivers.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - shellprocess@before
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - shellprocess@ember
      - luksbootkeyfile
      - initcpiocfg
      - initcpio
      - shellprocess@drivers
      - services-systemd
      - bootloader
      - umount
  - show:
      - finished

branding: ember
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
