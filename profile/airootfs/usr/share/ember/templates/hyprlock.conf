# Ember OS — екран блокування (theme: {{name}}, generated by /theme)

general {
    hide_cursor = true
    grace = 0
}

animations {
    enabled = true
    bezier = ember, 0.22, 1, 0.36, 1
    animation = fadeIn,  1, 5, ember
    animation = fadeOut, 1, 5, ember
    animation = inputFieldDots, 1, 2, ember
}

background {
    monitor =
    path = {{wallpaper}}
    blur_passes = 3
    blur_size = 8
    brightness = 0.75
    vibrancy = 0.2
}

# Часы
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba({{fg}}ff)
    font_size = 110
    font_family = Inter Display Bold
    position = 0, 260
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

# Дата
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba({{accent2}}ff)
    font_size = 24
    font_family = Inter
    position = 0, 160
    halign = center
    valign = center
}

# Лисёнок
image {
    monitor =
    path = {{fox_avatar}}
    size = 120
    rounding = 28
    border_size = 3
    border_color = rgba({{accent}}ee)
    position = 0, 10
    halign = center
    valign = center
}

# Имя пользователя
label {
    monitor =
    text = $USER
    color = rgba({{fg}}dd)
    font_size = 16
    font_family = Inter
    position = 0, -75
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba({{accent}}cc)
    inner_color = rgba({{bg}}bb)
    font_color = rgba({{fg}}ff)
    check_color = rgba({{accent3}}ff)
    fail_color = rgba(d9534fff)
    fade_on_empty = false
    placeholder_text = <span foreground="##{{fg}}99">Пароль · Password</span>
    fail_text = Невірний пароль · Wrong password · Неверный пароль
    rounding = 16
    position = 0, -145
    halign = center
    valign = center
}

# Подсказка внизу
label {
    monitor =
    text = Ember OS
    color = rgba({{fg}}77)
    font_size = 13
    font_family = Inter
    position = 0, 30
    halign = center
    valign = bottom
}

# Раскладка клавиатуры (клик — переключить)
label {
    monitor =
    text = $LAYOUT[EN,UA,RU]
    color = rgba({{fg}}aa)
    font_size = 14
    font_family = Inter
    onclick = hyprctl switchxkblayout all next
    position = 190, -145
    halign = center
    valign = center
}
